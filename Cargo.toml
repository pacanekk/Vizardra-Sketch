[package]
name = "vizardra"
version = "0.1.0"
edition = "2024"
description = "A premium creative playground for visual creation"

[dependencies]
iced = { version = "0.14", features = ["canvas", "advanced", "tokio", "svg"] }
iced_aw = { version = "0.14", default-features = false, features = ["menu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
